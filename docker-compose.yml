services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: datingapp-backend

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - /app/node_modules

    restart: always